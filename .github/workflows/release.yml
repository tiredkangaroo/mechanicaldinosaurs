name: Build and Release Daemon, Automation Engine, and VM Proxy

on:
  push:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "daemon/**"
      - "automation-engine/**"
      - "proxy/**"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build Daemon for multiple OS/ARCH
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Install libvirt dependencies (amd64)
        if: matrix.goarch == 'amd64'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            libvirt-dev

      - name: Install libvirt cross-compile dependencies (arm64)
        if: matrix.goarch == 'arm64'
        run: |
          # Stop background services that hold dpkg locks
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer apt-daily.service apt-daily-upgrade.service || true

          # Wait until any existing dpkg/apt lock is released
          while sudo fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/lib/dpkg/lock >/dev/null 2>&1; do
            echo "Waiting for background APT process to release locks..."
            sleep 2
          done

          sudo dpkg --add-architecture arm64

          # Restrict default repos to amd64 to prevent downloading redundant arm64 package indexes
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types: deb/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          fi

          # Add arm64 ports repository
          sudo tee /etc/apt/sources.list.d/arm64-ports.sources > /dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble noble-updates noble-security
          Components: main restricted universe multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          # Install cross-gcc, libvirt headers, and arm64 C runtime headers non-interactively
          export DEBIAN_FRONTEND=noninteractive
          export NEEDRESTART_MODE=a
          sudo -E apt-get update -qq
          sudo -E apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            -o Dpkg::Use-Pty=0 \
            gcc-aarch64-linux-gnu \
            libc6-dev:arm64 \
            libvirt-dev:arm64

      - name: Build and zip for ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          WORKSPACE_ROOT=$(pwd)
          build_dir="${WORKSPACE_ROOT}/builds/md-daemon-${{ matrix.goos }}-${{ matrix.goarch }}"
          output_name="md-daemon"
          renamed_binary="md-daemon-${{ matrix.goos }}-${{ matrix.goarch }}"

          mkdir -p "$build_dir"

          echo "Building for ${{ matrix.goos }}/${{ matrix.goarch }}..."

          export CGO_ENABLED=1
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            export CC=aarch64-linux-gnu-gcc
            export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
            export PKG_CONFIG_ALLOW_CROSS=1
          fi

          cd daemon
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w" -o "${build_dir}/${output_name}" .

          cd "$build_dir"
          chmod +x "$output_name"
          mv "$output_name" "$renamed_binary"

          zip_name="md-daemon-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
          zip -q "$zip_name" "$renamed_binary"

      - name: Upload zipped build
        uses: actions/upload-artifact@v4
        with:
          name: md-daemon-${{ matrix.goos }}-${{ matrix.goarch }}
          path: builds/md-daemon-${{ matrix.goos }}-${{ matrix.goarch }}/*.zip

  build-simple:
    name: Build ${{ matrix.project }} for multiple OS/ARCH
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        project: [automation-engine, proxy]
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Build and zip ${{ matrix.project }} for ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          WORKSPACE_ROOT=$(pwd)
          project="${{ matrix.project }}"
          build_dir="${WORKSPACE_ROOT}/builds/${project}-${{ matrix.goos }}-${{ matrix.goarch }}"
          output_name="${project}"
          renamed_binary="${project}-${{ matrix.goos }}-${{ matrix.goarch }}"

          if [ "${{ matrix.goos }}" = "windows" ]; then
            output_name="${output_name}.exe"
            renamed_binary="${renamed_binary}.exe"
          fi

          mkdir -p "$build_dir"

          echo "Building ${project} for ${{ matrix.goos }}/${{ matrix.goarch }}..."

          cd "$project"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w" -o "${build_dir}/${output_name}" .

          cd "$build_dir"
          mv "$output_name" "$renamed_binary"
          if [ "${{ matrix.goos }}" != "windows" ]; then
            chmod +x "$renamed_binary"
          fi

          zip_name="${project}-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
          zip -q "$zip_name" "$renamed_binary"

      - name: Upload zipped build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: builds/${{ matrix.project }}-${{ matrix.goos }}-${{ matrix.goarch }}/*.zip

  release:
    name: Create 'latest' GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, build-simple]

    steps:
      - name: Download all zipped artifacts
        uses: actions/download-artifact@v4
        with:
          path: final-builds
          merge-multiple: true

      - name: Create or update 'latest' release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest &>/dev/null; then
            echo "Release 'latest' exists. Deleting..."
            gh release delete latest --yes
          fi

          gh release create latest \
            --title "latest build" \
            --notes "Automated build for latest commit" \
            --latest

          gh release upload latest final-builds/*.zip --clobber
