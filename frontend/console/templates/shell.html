<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }
      #terminal-container {
        width: 100%;
        height: 100%;
        background: #000;
        z-index: 1;
      }
      #disconnected-message {
        position: absolute;
        width: 100vw;
        height: 100vh;
        display: none;
        /* display: flex; */
        align-items: center;
        justify-content: center;
        background: rgb(255, 196, 196);
        color: red;
        z-index: 10;
      }
      #error-message {
        background: rgb(207, 207, 207);
        padding: 10px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div id="disconnected-message">
      <div>
        <h1>The connection to the shell has been lost or could not be established.</h1>
        <pre id="error-message">error :rg erg</pre>
        <p style="text-align: center">Refresh the page to reconnect.</p>
      </div>
    </div>
    <div id="terminal-container"></div>

    <script>
      const term = new Terminal({
        cursorBlink: true,
        fontFamily: "monospace",
      });
      const fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      term.open(document.getElementById("terminal-container"));
      fitAddon.fit();

      const socket = new WebSocket("ws://{{ proxy_hostport }}");

      socket.onerror = (event) => {
        console.error("WebSocket error:", event);
        document.getElementById("error-message").textContent = event.message;
        document.getElementById("disconnected-message").style.display = "flex";
      };

      socket.onclose = (event) => {
        console.warn("WebSocket closed:", event);
        document.getElementById("error-message").textContent =
          `Code: ${event.code}, Reason: ${event.reason || "Reason unavailable"}`;
        document.getElementById("disconnected-message").style.display = "flex";
      };

      // Receive output from Go PTY -> Print to Terminal
      socket.onmessage = (event) => {
        term.write(event.data);
      };

      // Send input from Terminal -> Go PTY
      term.onData((data) => {
        if (socket.readyState === WebSocket.OPEN) {
          socket.send(data);
        }
      });

      // Send initial window size and handle resize events
      const sendResize = () => {
        if (socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ cols: term.cols, rows: term.rows }));
        }
      };

      socket.onopen = () => {
        sendResize();
      };

      window.addEventListener("resize", () => {
        fitAddon.fit();
        sendResize();
      });
    </script>
  </body>
</html>
