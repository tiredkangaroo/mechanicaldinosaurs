{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>make a deployment</title>
    <link rel="stylesheet" href="{% static 'root.css' %}" />
    <style>
      :root {
        --card-bg: #ffffff;
        --text-color: #2c2520;
        --border-color: #e2ded5;
        --accent-color: #6d5000;
      }

      body {
        color: var(--text-color);
        margin: 0;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
      }

      .container {
        width: 100%;
        max-width: 650px;
        background: var(--card-bg);
        padding: 30px;
        border-radius: 8px;
      }

      h2 {
        margin-top: 0;
        margin-bottom: 24px;
        padding-bottom: 10px;
        color: var(--accent-color);
      }

      .form-group {
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      label {
        font-size: 0.9rem;
        margin-bottom: 6px;
        font-weight: bold;
      }

      input[type="text"],
      input[type="number"] {
        padding: 10px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        font-family: inherit;
        font-size: 0.95rem;
        background-color: #fdfdfd;
      }

      input:focus {
        outline: none;
        border-color: var(--accent-color);
        background-color: #fff;
      }

      .help-text {
        font-size: 0.8rem;
        color: #666;
        margin-top: 4px;
      }

      .checkbox-group {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 10px;
        /* margin: 25px 0; */
      }

      .checkbox-group input {
        width: 18px;
        height: 18px;
        cursor: pointer;
      }

      button[type="submit"] {
        width: 100%;
        padding: 12px;
        font-size: 1rem;
        margin-top: 10px;
        transition: background-color 0.2s ease;
      }

      fieldset {
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 16px;
        margin-bottom: 20px;
        background-color: #fafafa;
      }

      legend {
        font-family: "Playfair Display", serif;
        font-weight: 700;
        padding: 0 8px;
        font-size: 0.95rem;
        color: var(--accent-color);
      }

      select {
        padding: 10px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        font-family: inherit;
        font-size: 0.95rem;
        background-color: #fdfdfd;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>deploy</h2>

      <form method="POST">
        {% csrf_token %}

        <!-- Core Metadata -->
        <div class="form-row">
          <div class="form-group">
            <label for="name">Deployment Name</label>
            <input type="text" id="name" name="name" placeholder="e.g. web-app" required />
          </div>
          <div class="form-group">
            <label for="namespace">Namespace</label>
            <input type="text" id="namespace" name="namespace" value="default" placeholder="default" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="image">Docker Image</label>
            <input type="text" id="image" name="image" placeholder="e.g. nginx:latest" required />
          </div>
          <div class="form-group">
            <label for="image_pull_policy">Image Pull Policy</label>
            <select name="image_pull_policy" id="image_pull_policy">
              <option value="IfNotPresent">IfNotPresent</option>
              <option value="Always">Always</option>
              <option value="Never">Never</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="replicas">Replicas</label>
          <input type="number" id="replicas" name="replicas" value="1" min="1" required />
        </div>

        <!-- Compute Resource Strategy -->
        <fieldset>
          <legend>Resources</legend>
          <div class="form-row">
            <div class="form-group">
              <label for="cpuResourceRequest">CPU Request</label>
              <input type="text" id="cpuResourceRequest" name="cpuResourceRequest" placeholder="e.g. 250m" />
            </div>
            <div class="form-group">
              <label for="memoryResourceRequest">Memory Request</label>
              <input type="text" id="memoryResourceRequest" name="memoryResourceRequest" placeholder="e.g. 256Mi" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="cpuResourceLimit">CPU Limit</label>
              <input type="text" id="cpuResourceLimit" name="cpuResourceLimit" placeholder="e.g. 500m" />
            </div>
            <div class="form-group">
              <label for="memoryResourceLimit">Memory Limit</label>
              <input type="text" id="memoryResourceLimit" name="memoryResourceLimit" placeholder="e.g. 512Mi" />
            </div>
          </div>
        </fieldset>

        <!-- note: make it show/hide storage options in the future depending on whether the checkbox was clicked -->
        <fieldset>
          <legend>Storage</legend>
          <div class="form-group checkbox-group">
            <input type="checkbox" id="use_persistent_storage" name="use_persistent_storage" value="true" />
            <label for="use_persistent_storage" style="margin: 0">Use Persistent Storage</label>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="storage_size">storage size</label>
              <input type="text" id="storage_size" name="storage_size" placeholder="e.g. 1Gi" />
            </div>
            <div class="form-group">
              <label for="storage_mount_path">mount path</label>
              <input type="text" id="storage_mount_path" name="storage_mount_path" placeholder="e.g. /data" />
              <span class="help-text">container mount path (e.g. for postgres: /var/lib/postgresql/data).</span>
            </div>
          </div>
        </fieldset>

        <!-- Networking & Variables -->
        <div class="form-group">
          <label for="ports">Port Map Configuration</label>
          <input type="text" id="ports" name="ports" placeholder="e.g. 80:80,8080:0" />
          <span class="help-text"
            >Comma-separated mappings -> containerPort:servicePort. Use 0 if the port shouldn't be exposed.</span
          >
        </div>

        <!-- note: consider making this a table or something down the road -->
        <div class="form-group">
          <label for="env_vars">Environment Variables</label>
          <input type="text" id="env_vars" name="env_vars" placeholder="e.g. ENV=production,DEBUG=false" />
          <span class="help-text">Comma-separated key-value pairs (key=value).</span>
        </div>

        <div class="form-group checkbox-group">
          <input type="checkbox" id="expose_externally" name="expose_externally" value="true" />
          <label for="expose_externally">Set up a Service to Expose Internal Ports</label>
        </div>

        <button type="submit">Deploy to Cluster</button>
      </form>
    </div>
  </body>
</html>
