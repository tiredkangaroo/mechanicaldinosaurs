<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Machines</title>
    <style>
      .machine-form {
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .machine-form > input {
        padding: 8px;
        font-size: 16px;
      }
      .machine-form > button {
        padding: 10px;
        font-size: 16px;
        cursor: pointer;
      }
      .add-machine-container {
        margin-top: 40px;
        width: 50%;
      }
      .add-machine-container h1 {
        text-align: center;
      }
      .machine-list {
        list-style-type: none;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .machine-list-item {
        background-color: #f0f0f0;
        padding: 10px;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
      }
    </style>
  </head>
  <body>
    <h1>your machines</h1>
    <ul class="machine-list">
      {% for machine in machines %}
      <li class="machine-list-item">
        <div><b>{{ machine.name }}</b> ({{ machine.hostport }})</div>
        <div>
          <!-- apparently the django way of doing it is this... html forms don't even support DELETE -->
          <form action="/machine/{{ machine.name }}/delete/" method="post" style="margin: 0">
            {% csrf_token %}
            <button type="submit">delete</button>
          </form>
        </div>
      </li>
      {% endfor %}
    </ul>

    <div class="add-machine-container">
      <h1>add a machine</h1>
      <form method="post" action="{% url 'machines' %}" class="machine-form">
        {% csrf_token %}
        <input type="text" name="name" placeholder="machine name" required />
        <input type="text" name="hostport" placeholder="hostport" required />
        <input type="text" name="secret_key" placeholder="secret key" required />
        <button type="submit">add da machine</button>
      </form>
    </div>
  </body>
</html>
