{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <link rel="stylesheet" href="{% static 'root.css' %}" />
    <style>
      #passkeyButton {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
      }
      #loginForm {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 35%;
      }
      #loginForm > input {
        padding: 6px;
        border-radius: 4px;
        border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <body style="width: 75%; margin: auto; padding-top: 20px; padding-bottom: 20px">
    <div style="display: flex; flex-direction: row; align-items: center; justify-content: space-between; padding: 20px; border-bottom: 4px solid #ddd">
      <h1>mechanical dinosaurs 🦕</h1>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;">
      <h1>login</h1>
      {% if error %}
      <div class="error-flash">
        <p>{{ error }}</p>
      </div>
      {% endif %}
      <form id="loginForm" method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" required />
        <input type="password" name="password" placeholder="Password" required />
        {% if request.GET.next %}
        <input type="hidden" name="next" value="{{ request.GET.next }}" />
        {% endif %}
        <input type="hidden" name="passkeys" id="passkeys" />
        <button type="submit">Login</button>
      </form>
      <br />
      <button id="passkeyButton" type="button" onclick="authn('loginForm')">
        login with passkey
      </button>
    </div>
    {%include 'passkeys/passkeys.js' with allow_password=True %}
    <script>
      function no_credentials_found() {
        console.log("no credentials found");
        var searchParams = new URLSearchParams(window.location.search);
        searchParams.set("next", "{% url 'passkeys:enroll' %}");
        window.location.search = searchParams.toString();
      }
    </script>
  </body>
</html>
